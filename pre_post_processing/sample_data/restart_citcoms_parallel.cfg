# Run from the master model directory:
# python /path/to/restart_citcoms_parallel.py restart.cfg
# Paths below are relative to that directory, matching the serial workflow.
master_run_cfg = pid001272280.cfg
master_run_pid = pid001272280-gridmaker.cfg

# Maximum concurrent ages. Start conservatively: each age loads a model volume.
workers = 2

restart_ages = 165Ma/0Ma/5Ma
restart_type = dynamic_topography
restart_structure = separate
lithosphere_depth_DT = 100.0
lithosphere_temperature_DT = 0.3

CitcomS.solver.bc.topvbc = 0
CitcomS.solver.output.output_ll_max = 80
CitcomS.solver.tsolver.finetunedt = 0.01
CitcomS.solver.param.exclude_buoy_above_znode = 1
CitcomS.solver.param.exclude_buoy_znode = 57
CitcomS.solver.tracer.chemical_buoyancy = 0

# Generated IC filenames end in .0, so solution_cycles_init is fixed to 0.
# datafile_old matches the actual IC prefix; tic_method=-1 loads these files.
# The legacy steps=RS_TIMESTEP default resolves to the source timestep.
# To change the solver run length, explicitly set CitcomS.steps here.
# This preparer creates inputs only; it does not launch CitcomS.
